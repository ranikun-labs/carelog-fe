name: Carelog FE verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional full same-repository commit SHA to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: carelog-fe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Validate manual commit selection
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          if [[ -n "$TARGET_SHA" && ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'target_sha must be a full lowercase commit SHA'
            exit 1
          fi

      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed 2026-11-09
        with:
          ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record and verify source identity
        env:
          REQUESTED_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          mkdir -p .artifacts/ci
          git rev-parse HEAD > .artifacts/ci/source-head.txt
          test "$(cat .artifacts/ci/source-head.txt)" = "$REQUESTED_SHA"
          printf '%s\n' "$REQUESTED_SHA" > .artifacts/ci/requested-head.txt
          printf '%s\n' "$WORKFLOW_SHA" > .artifacts/ci/workflow-head.txt

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'

      - name: Select pinned pnpm and cache path
        id: pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache dependency store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: carelog-pnpm-${{ runner.os }}-node22-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install frozen dependencies
        id: install
        shell: bash
        run: pnpm install --frozen-lockfile 2>&1 | tee .artifacts/ci/install.log

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: pnpm run typecheck 2>&1 | tee .artifacts/ci/typecheck.log

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: pnpm run lint 2>&1 | tee .artifacts/ci/lint.log

      - name: Unit and provider integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: pnpm run test --reporter=default --reporter=json --outputFile=.artifacts/ci/vitest.json 2>&1 | tee .artifacts/ci/unit.log

      - name: Canonical client SSR and prerender build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: pnpm run build 2>&1 | tee .artifacts/ci/build.log

      - name: Preserve exact phase and assertion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carelog-fe-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
