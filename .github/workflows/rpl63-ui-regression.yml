name: RPL-63 UI Regression

on:
  push:
    branches:
      - rpl63-ui-regression-20261030

permissions:
  contents: read

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Carelog FE source
        uses: actions/checkout@v4
        with:
          ref: ed1c19fefcf4f3d7ca5e2f6d35f6ac0cd08fc40b
          persist-credentials: false

      - name: Verify tested source SHA
        run: test "$(git rev-parse HEAD)" = "ed1c19fefcf4f3d7ca5e2f6d35f6ac0cd08fc40b"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run static UI Playwright regression
        run: pnpm test:e2e
